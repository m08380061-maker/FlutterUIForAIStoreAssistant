include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
    # onnx_vision_provider.dart references package:onnxruntime which is not
    # yet declared in pubspec.yaml. This is incomplete code for a future
    # ONNX vision feature. It will be re-enabled when the dependency is added.
    - lib/features/ai_assistant/services/onnx_vision_provider.dart

linter:
  rules:
    # Disable deprecated_member_use to avoid failing CI on withOpacity
    # deprecation (Flutter 3.32+). The migration to withValues(alpha:)
    # is tracked as a Phase 2 task.
    deprecated_member_use: false
