name: Android Release Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Java 17 ─────────────────────────────────────────────────────────────
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── Flutter ─────────────────────────────────────────────────────────────
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: 'stable'
          cache: true

      # ── Android NDK (required by externalNativeBuild / CMake block) ─────────
      - name: Install Android NDK 27.0.12077973
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "ndk;27.0.12077973" --channel=0

      # ── Dependencies ─────────────────────────────────────────────────────────
      - name: Install Flutter dependencies
        run: flutter pub get

      # ── Static analysis ──────────────────────────────────────────────────────
      - name: Analyze (non-fatal warnings)
        run: flutter analyze --no-fatal-warnings || true

      # ── Release signing ──────────────────────────────────────────────────────
      # Required GitHub Actions secrets:
      #   KEYSTORE_BASE64   — base64-encoded release.jks (run: base64 -w0 android/app/release.jks)
      #   KEY_STORE_PASSWORD — keystore store password
      #   KEY_ALIAS          — key alias (e.g. upload)
      #   KEY_PASSWORD       — key password
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.jks

      - name: Write key.properties
        env:
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=release.jks\n' \
            "$KEY_STORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" \
            > android/key.properties

      # ── Build ────────────────────────────────────────────────────────────────
      - name: Build release APK
        run: flutter build apk --release

      # ── Upload artifact ──────────────────────────────────────────────────────
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
